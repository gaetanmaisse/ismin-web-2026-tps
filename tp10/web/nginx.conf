# Given. nginx serves the files of `npm run build`: index.html, and assets/.
server {
  listen 80;
  root /usr/share/nginx/html;

  # The SPA fallback. An address like /models/mistral-7b-instruct-v0-3 is
  # not a file: without this line, reloading it answers 404. With it, nginx
  # sends index.html, React starts, and React Router reads the address.
  location / {
    try_files $uri /index.html;
  }
}
